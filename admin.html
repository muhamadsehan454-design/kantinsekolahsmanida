<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kantin Digital SMAN 1 Dramaga</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* gray-50 */
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <!-- Main Container -->
    <div class="container mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">

        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">
                Panel Admin Kantin Digital
            </h1>
            <p class="mt-1 text-base text-gray-600">SMAN 1 Dramaga</p>
        </header>

        <!-- Admin Section -->
        <section id="admin-panel" class="bg-white p-6 rounded-2xl shadow-lg">
            <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Rekapan</h2>
            
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-blue-100 p-6 rounded-xl text-center">
                    <p class="text-sm font-medium text-blue-800">Total Pemasukan</p>
                    <p id="admin-total-revenue" class="text-3xl font-bold text-blue-900 mt-1">Rp 0</p>
                </div>
                <div class="bg-green-100 p-6 rounded-xl text-center">
                    <p class="text-sm font-medium text-green-800">Pemasukan (QRIS)</p>
                    <p id="admin-qris-revenue" class="text-3xl font-bold text-green-900 mt-1">Rp 0</p>
                </div>
                <div class="bg-indigo-100 p-6 rounded-xl text-center">
                    <p class="text-sm font-medium text-indigo-800">Pemasukan (Saldo Sekolah)</p>
                    <p id="admin-saldo-revenue" class="text-3xl font-bold text-indigo-900 mt-1">Rp 0</p>
                </div>
            </div>

            <!-- Transaction History Table -->
            <h3 class="text-2xl font-bold mb-4">Riwayat Transaksi</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200 rounded-lg">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tanggal</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Item</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Metode Bayar</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-history-body" class="divide-y divide-gray-200">
                        <!-- History will be injected here -->
                        <tr>
                           <td colspan="4" class="text-center py-8 text-gray-500">Memuat data transaksi...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Footer for Back Link -->
        <footer class="text-center mt-12 border-t pt-6">
            <p class="text-gray-600">
                <a href="index.html" class="text-indigo-600 hover:underline font-semibold">Kembali ke Halaman Kantin</a>
            </p>
        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- DOM ELEMENTS ---
            const adminTotalRevenue = document.getElementById('admin-total-revenue');
            const adminQrisRevenue = document.getElementById('admin-qris-revenue');
            const adminSaldoRevenue = document.getElementById('admin-saldo-revenue');
            const transactionHistoryBody = document.getElementById('transaction-history-body');
            
            // --- FUNCTIONS ---
            const formatRupiah = (number) => {
                return new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0
                }).format(number);
            };

            const renderAdminRecap = () => {
                // Get transaction data from localStorage
                const transactionHistory = JSON.parse(localStorage.getItem('kantinDigitalTransactions')) || [];

                let totalRevenue = 0;
                let qrisRevenue = 0;
                let saldoRevenue = 0;

                transactionHistory.forEach(trx => {
                    totalRevenue += trx.total;
                    if (trx.paymentMethod === 'Qris') {
                        qrisRevenue += trx.total;
                    } else {
                        saldoRevenue += trx.total;
                    }
                });

                adminTotalRevenue.textContent = formatRupiah(totalRevenue);
                adminQrisRevenue.textContent = formatRupiah(qrisRevenue);
                adminSaldoRevenue.textContent = formatRupiah(saldoRevenue);
                
                if (transactionHistory.length === 0) {
                    transactionHistoryBody.innerHTML = `
                        <tr>
                           <td colspan="4" class="text-center py-8 text-gray-500">Belum ada transaksi.</td>
                        </tr>`;
                } else {
                    transactionHistoryBody.innerHTML = transactionHistory.map(trx => `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${trx.date}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">
                                ${trx.items.map(item => `${item.name} (x${item.quantity})`).join(', ')}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-900">${formatRupiah(trx.total)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${trx.paymentMethod}</td>
                        </tr>
                    `).reverse().join(''); // .reverse() to show latest first
                }
            };

            // --- INITIAL RENDER ---
            renderAdminRecap();
        });
    </script>
</body>
</html>
